name: Metrics
on:
  schedule:
    - cron: '33 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34 (pinned; @latest = supply-chain risk)
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AkashPriyadarshii
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_display: large
          plugin_achievements: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
      # metrics commits metrics.svg to main automatically via its own token
