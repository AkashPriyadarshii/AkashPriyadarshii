name: Generate Stats SVG
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths: ['gen_stats.py']

permissions:
  contents: write

jobs:
  stats:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gen_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet || git commit -m "[auto] refresh stats.svg"
          git push
